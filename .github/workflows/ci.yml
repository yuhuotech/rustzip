name: CI

on:
  workflow_dispatch:
  # Automatic runs are paused until the project is ready.
  # push:
  #   branches: [main]
  # pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-archive-deps
        id: native-deps
      - name: Test self-contained macOS archive libraries
        if: runner.os == 'macOS'
        run: packaging/macos/test-homebrew-library-bundling.sh
      - name: Smoke test Linux desktop integration installer
        if: runner.os == 'Linux'
        run: |
          cargo build -p rz-updater
          bash packaging/linux/test-install.sh
      - name: Save vcpkg binary packages before tests
        if: runner.os == 'Windows'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\rustzip-vcpkg-cache
          key: rustzip-vcpkg-x64-windows-static-md-${{ steps.native-deps.outputs.vcpkg-revision }}-v2
      - run: cargo fmt --all --check
      # The GUI crates need a graphics stack; they are built in their own job.
      - run: cargo clippy --workspace --exclude rustzip-gui --exclude gpui-probe --all-targets -- -D warnings
      - run: cargo test --workspace --exclude rustzip-gui --exclude gpui-probe
      # The optional RAR reader builds the unRAR C++ sources.
      - run: cargo clippy --workspace --exclude rustzip-gui --exclude gpui-probe --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude rustzip-gui --exclude gpui-probe --all-features
      - name: Test Linux update and rollback transactions
        if: runner.os == 'Linux'
        run: bash packaging/linux/test-update.sh
      - name: Test Windows update and rollback transactions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-update.ps1
      - name: Smoke test Windows system keychain
        if: runner.os == 'Windows'
        run: cargo test -p rz-services --all-features keychain::tests::round_trip_through_the_real_keychain -- --ignored --exact

  gui:
    name: gui / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-archive-deps
        id: native-deps
      - name: Check vendored GPUI formatting
        run: |
          cargo fmt --manifest-path vendor/gpui-pre-windows/Cargo.toml -- --check
          cargo fmt --manifest-path vendor/gpui-pre-linux/Cargo.toml -- --check
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev libssl-dev \
            pkg-config xvfb
      - name: Save vcpkg binary packages before tests
        if: runner.os == 'Windows'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\rustzip-vcpkg-cache
          key: rustzip-vcpkg-x64-windows-static-md-${{ steps.native-deps.outputs.vcpkg-revision }}-v2
      - run: cargo clippy -p rustzip-gui --all-targets --all-features -- -D warnings
      - name: Build isolated preview helpers for UI tests
        run: cargo build -p rz-pdf-renderer -p rz-video-renderer
      - name: Test GUI under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 cargo test -p rustzip-gui --all-features
      - name: Test the native X11 file drag source
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: xvfb-run -a cargo test --manifest-path vendor/gpui-pre-linux/Cargo.toml --lib xdnd --no-default-features --features x11,test-support
      - name: Test GUI
        if: runner.os != 'Linux'
        run: cargo test -p rustzip-gui --all-features
      - name: Test the native Windows Shell file drag source
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --manifest-path vendor/gpui-pre-windows/Cargo.toml --lib shell_data_object_exposes_cf_hdrop --features test-support
      - name: Quick Look ZIP safety smoke (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/test-quicklook.sh
      - name: Smoke test macOS automatic updates
        if: runner.os == 'macOS'
        run: packaging/macos/test-update-helper.sh
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: ./packaging/windows/ci-smoke.ps1

  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-archive-deps
      - run: cargo bench -p rz-engine
        env:
          RZ_BENCH_MB: "32"
