name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The GUI crates need a graphics stack; they are built in their own job.
      - run: cargo clippy --workspace --exclude rustzip-gui --exclude gpui-probe --all-targets -- -D warnings
      - run: cargo test --workspace --exclude rustzip-gui --exclude gpui-probe
      # The optional RAR reader builds the unRAR C++ sources.
      - run: cargo clippy --workspace --exclude rustzip-gui --exclude gpui-probe --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude rustzip-gui --exclude gpui-probe --all-features

  gui:
    name: gui / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is left out until the GPUI Kit system packages are verified on a runner.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rustzip-gui --all-targets -- -D warnings
      - run: cargo test -p rustzip-gui

  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p rz-engine
        env:
          RZ_BENCH_MB: "32"
