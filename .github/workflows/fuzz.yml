name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fuzz/**"
      - "apps/audio-preview/**"
      - "apps/pdf-renderer/**"
      - "apps/preview-budget/**"
      - "apps/video-renderer/**"
      - "apps/gui/src/audio_preview.rs"
      - "apps/gui/src/pdf_preview.rs"
      - "crates/rz-app/src/preview.rs"
      - "crates/rz-core/**"
      - "crates/rz-engine/**"
      - "crates/rz-ffi/**"
      - "crates/rz-formats/**"
      - "vendor/libchm/**"
      - "vendor/pbz2/**"
      - "vendor/rust_h264/**"
  workflow_dispatch:
    inputs:
      verify_crash_artifact:
        description: Run the isolated crash-artifact upload smoke in addition to normal fuzz targets.
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "7 2 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: zip_recovery
            features: ""
            max_len: 1048576
          - target: chm
            features: ""
            max_len: 8388608
          - target: bzip2
            features: ""
            max_len: 8388608
          - target: rar
            features: rar
            max_len: 8388608
          - target: nsis
            features: ""
            max_len: 16777216
          - target: pdf_parser
            features: ""
            max_len: 16777216
          - target: audio_decoder
            features: ""
            max_len: 8388608
          - target: video_decoder
            features: ""
            max_len: 16777216
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-archive-deps
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview, rust-src
      - name: Install cargo-fuzz
        run: cargo install --locked --version "$CARGO_FUZZ_VERSION" cargo-fuzz
      - name: Select nightly rustc for sanitizer builds
        shell: bash
        run: echo "RUSTC=$(rustup which rustc --toolchain nightly)" >> "$GITHUB_ENV"
      - name: Prepare persistent corpus directory
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: mkdir -p "fuzz/corpus/$FUZZ_TARGET"
      - uses: actions/cache/restore@v4
        id: corpus
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Restore reviewed seed corpus
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$FUZZ_TARGET" == "nsis" ]]; then
            python3 fuzz/make_nsis_seed.py "fuzz/corpus/$FUZZ_TARGET/synthetic-pe-overlay"
          elif [[ "$FUZZ_TARGET" == "pdf_parser" ]]; then
            python3 fuzz/make_pdf_seed.py "fuzz/corpus/$FUZZ_TARGET/minimal.pdf"
          elif [[ "$FUZZ_TARGET" == "audio_decoder" ]]; then
            python3 fuzz/make_wav_seed.py "fuzz/corpus/$FUZZ_TARGET/minimal.wav"
            cp -R "fuzz/seeds/$FUZZ_TARGET/." "fuzz/corpus/$FUZZ_TARGET/"
          elif [[ "$FUZZ_TARGET" == "video_decoder" ]]; then
            cp apps/video-renderer/tests/fixtures/small-h264.mp4 apps/video-renderer/tests/fixtures/small-h264.mov \
              apps/video-renderer/tests/fixtures/mp4-box-loop.mp4 \
              apps/video-renderer/tests/fixtures/zero-samples-per-chunk.mp4 \
              apps/video-renderer/tests/fixtures/missing-stts-entry.mp4 \
              apps/video-renderer/tests/fixtures/extended-box-size.mp4 \
              apps/video-renderer/tests/fixtures/intra8x8-out-of-frame.mov \
              apps/video-renderer/tests/fixtures/intra16x16-out-of-frame.mov \
              "fuzz/corpus/$FUZZ_TARGET/"
          else
            cp -R "fuzz/seeds/$FUZZ_TARGET/." "fuzz/corpus/$FUZZ_TARGET/"
          fi
      - name: Build fuzz target
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_FEATURES: ${{ matrix.features }}
        shell: bash
        run: |
          if [[ -n "$FUZZ_FEATURES" ]]; then
            cargo fuzz build "$FUZZ_TARGET" --features "$FUZZ_FEATURES"
          else
            cargo fuzz build "$FUZZ_TARGET"
          fi
      - name: Fuzz target
        id: run-fuzz
        continue-on-error: true
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_FEATURES: ${{ matrix.features }}
          FUZZ_MAX_LEN: ${{ matrix.max_len }}
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '180' || '60' }}
        shell: bash
        run: |
          if [[ -n "$FUZZ_FEATURES" ]]; then
            cargo fuzz run "$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" --features "$FUZZ_FEATURES" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len="$FUZZ_MAX_LEN" -timeout=10 -rss_limit_mb=4096
          else
            cargo fuzz run "$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len="$FUZZ_MAX_LEN" -timeout=10 -rss_limit_mb=4096
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.corpus.outputs.cache-primary-key != ''
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: steps.run-fuzz.outcome == 'failure'
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail the job after preserving corpus and artifacts
        if: steps.run-fuzz.outcome == 'failure'
        run: exit 1

  crash-artifact-smoke:
    name: crash artifact / smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_crash_artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-archive-deps
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview, rust-src
      - name: Install cargo-fuzz
        run: cargo install --locked --version "$CARGO_FUZZ_VERSION" cargo-fuzz
      - name: Select nightly rustc for sanitizer builds
        shell: bash
        run: echo "RUSTC=$(rustup which rustc --toolchain nightly)" >> "$GITHUB_ENV"
      - name: Build sentinel fuzz target
        run: cargo fuzz build artifact_smoke
      - name: Trigger the reviewed crash sentinel
        id: crash
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p fuzz/corpus/artifact_smoke
          printf 'rustzip-crash-artifact-smoke-v1' > fuzz/corpus/artifact_smoke/reviewed-sentinel
          cargo fuzz run artifact_smoke fuzz/corpus/artifact_smoke -- \
            -runs=1 -timeout=10 -rss_limit_mb=4096
      - name: Confirm libFuzzer produced a crash artifact
        if: steps.crash.outcome == 'failure'
        shell: bash
        run: |
          crash_file="$(find fuzz/artifacts/artifact_smoke -type f -name 'crash-*' -print -quit)"
          test -n "$crash_file"
          test -s "$crash_file"
          echo "Captured $crash_file"
      - name: Reject a missing crash artifact
        if: steps.crash.outcome != 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: steps.crash.outcome == 'failure'
        with:
          name: fuzz-crash-artifact-smoke-${{ github.run_id }}
          path: |
            fuzz/artifacts/artifact_smoke
            fuzz/corpus/artifact_smoke
          if-no-files-found: error
          retention-days: 14
