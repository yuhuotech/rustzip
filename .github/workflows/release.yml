name: Release

# Run a dry-run from any branch, or dispatch a v* tag with dry_run=false to publish.
# One-time setup (see docs/release.md):
#   - repository secret RZ_UPDATE_KEY: the update signing key (64 hex characters)
#   - optional repository variable RZ_STATS_URL: https address that receives install reports
#   - optional macOS signing secrets: MACOS_CERT_P12 (base64), MACOS_CERT_PASSWORD,
#     MACOS_SIGN_IDENTITY, and for notarization APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and verify all platform packages without publishing. Use false only for a v* release tag.
        required: true
        type: boolean
        default: true
  # Automatic tag builds and releases are paused until the project is ready.
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RZ_STATS_URL: ${{ vars.RZ_STATS_URL }}

jobs:
  dry-run-signing-key:
    name: Prepare disposable dry-run signing key
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate manual release selection
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "A non-dry-run release must be dispatched from a v* tag." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - uses: ./.github/actions/native-archive-deps
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - name: Build release verifier
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo build --release -p rz-release
      - name: Generate disposable run-scoped key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          key_dir="$RUNNER_TEMP/rustzip-dry-run-key"
          mkdir -m 700 -p "$key_dir"
          public_rust="$(target/release/rz-release keygen "$key_dir/private.hex")"
          python3 -c 'import re,sys; b=re.findall(r"0x([0-9a-fA-F]{2})",sys.argv[1]); assert len(b)==32; print("".join(x.lower() for x in b))' \
            "$public_rust" > "$key_dir/public.hex"
          chmod 600 "$key_dir/private.hex"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          name: rustzip-dry-run-signing-key
          path: ${{ runner.temp }}/rustzip-dry-run-key
          retention-days: 1

  build:
    needs: dry-run-signing-key
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # rust-toolchain.toml overrides the action's stable toolchain; build each macOS architecture on its native runner.
          - { os: macos-15, platform: macos-aarch64, target: aarch64-apple-darwin, experimental: false }
          - { os: macos-15-intel, platform: macos-x86_64, target: x86_64-apple-darwin, experimental: false }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc, experimental: false }
          # The Linux desktop build has not been verified on real hardware yet.
          - { os: ubuntu-22.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/native-archive-deps

      - name: Download disposable dry-run signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          name: rustzip-dry-run-signing-key
          path: ${{ runner.temp }}/rustzip-dry-run-key

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev libssl-dev pkg-config

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Without a certificate the app is ad-hoc signed by the packaging script.
          if [ -n "$MACOS_CERT_P12" ]; then
            echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
            rm cert.p12
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ "${{ inputs.dry_run }}" != "true" && -n "${{ secrets.APPLE_ID }}" ]]; then
            xcrun notarytool store-credentials ci --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
            export NOTARY_PROFILE=ci
          fi
          packaging/macos/build-app.sh dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p rustzip-gui
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" `
            "/DSourceExe=$PWD\target\release\rustzip.exe" "/DOutDir=$PWD\dist" packaging\windows\rustzip.iss

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/build-tarball.sh dist

      - name: Sign for the updater
        shell: bash
        env:
          RZ_UPDATE_KEY: ${{ secrets.RZ_UPDATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              key_dir="$(cygpath -u "$RUNNER_TEMP")/rustzip-dry-run-key"
            else
              key_dir="$RUNNER_TEMP/rustzip-dry-run-key"
            fi
            key_file="$key_dir/private.hex"
            if [[ ! -f "$key_file" ]]; then
              echo "Dry-run signing key is missing" >&2
              exit 1
            fi
            chmod 600 "$key_file"
            RZ_UPDATE_KEY="$(cat "$key_file")"
            export RZ_UPDATE_KEY
          fi
          cargo build --release -p rz-release
          case "${{ matrix.platform }}" in
            macos-aarch64|macos-x86_64) pattern='RustZIP-*.dmg' ;;
            windows-x86_64) pattern='RustZIP-*.exe' ;;
            linux-x86_64) pattern='RustZIP-*.tar.gz' ;;
            *) echo "Unknown release platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name "$pattern" -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one $pattern package for ${{ matrix.platform }}, found ${#packages[@]}" >&2
            exit 1
          fi
          file="${packages[0]}"
          name="$(basename "$file")"
          url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name"
          bin=target/release/rz-release
          "$bin" sign "${{ steps.v.outputs.version }}" "${{ matrix.platform }}" "$file" "$url" > "dist/${{ matrix.platform }}.asset.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/RustZIP-*.dmg
            dist/RustZIP-*.exe
            dist/RustZIP-*.tar.gz
            dist/*.asset.json

  assemble:
    needs: [build, dry-run-signing-key]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: ${{ !cancelled() && (inputs.dry_run || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Download disposable dry-run verification key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          name: rustzip-dry-run-signing-key
          path: ${{ runner.temp }}/rustzip-dry-run-key
      - name: Verify platform artifacts and manifest
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_PUBLIC_KEY_FILE: ${{ runner.temp }}/rustzip-dry-run-key/public.hex
        run: |
          cargo build --release -p rz-release
          version="$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag version $tag_version does not match Cargo.toml $version" >&2
              exit 1
            fi
            version="$tag_version"
          fi
          expected_platforms="$(printf '%s\n' linux-x86_64 macos-aarch64 macos-x86_64 windows-x86_64 | sort)"
          actual_platforms="$(jq -r '.platform' artifacts/*.asset.json | sort)"
          if [[ "$actual_platforms" != "$expected_platforms" ]]; then
            echo "Expected exactly these release platforms:" >&2
            echo "$expected_platforms" >&2
            echo "Found:" >&2
            echo "$actual_platforms" >&2
            exit 1
          fi
          printf 'RustZIP %s\n' "$version" > notes.txt
          target/release/rz-release manifest "$version" notes.txt artifacts/*.asset.json > artifacts/update.json
          if [[ "$DRY_RUN" == "true" ]]; then
            target/release/rz-release verify artifacts/update.json artifacts "$(cat "$DRY_RUN_PUBLIC_KEY_FILE")"
          else
            target/release/rz-release verify artifacts/update.json artifacts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dry_run == true && 'release-dry-run-bundle' || 'release-bundle' }}
          path: |
            artifacts/RustZIP-*
            artifacts/update.json
          retention-days: 14

  publish:
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "RustZIP ${GITHUB_REF_NAME#v}" --generate-notes \
            artifacts/RustZIP-* artifacts/update.json
