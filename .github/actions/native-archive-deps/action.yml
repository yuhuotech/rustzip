name: Install native archive build dependencies
description: Install the static libarchive prerequisites used by rz-ffi.
runs:
  using: composite
  steps:
    - name: Install Linux development libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang libclang-dev pkg-config libb2-dev libxml2-dev \
          zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libacl1-dev libssl-dev

    - name: Install macOS libraries
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake pkg-config libb2 libxml2 zlib bzip2 xz zstd lz4

    - name: Identify Windows vcpkg version
      if: runner.os == 'Windows'
      id: vcpkg-version
      shell: pwsh
      run: |
        $version = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
        if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Unable to identify vcpkg version" }
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Cache Windows vcpkg packages
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\rustzip-vcpkg-cache
        key: rustzip-vcpkg-x64-windows-static-md-${{ steps.vcpkg-version.outputs.version }}-v2

    - name: Install Windows libraries
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm -y --no-progress
        "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH
        $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP "rustzip-vcpkg-cache"
        $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static-md"
        "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        vcpkg install zlib bzip2 liblzma zstd lz4 openssl --triplet $env:VCPKG_DEFAULT_TRIPLET
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # libarchive2-sys links zlib.lib; the vcpkg zlib port names its import library z.lib.
        $vcpkgLib = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET\lib"
        # The zlib port names its x64-windows static-md library zs.lib.
        $zlib = @("zs.lib", "z.lib", "zlib.lib", "zlibstatic.lib") | ForEach-Object { Join-Path $vcpkgLib $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $zlib) { throw "vcpkg static zlib library is missing" }
        $libarchiveZlib = Join-Path $vcpkgLib "zlib.lib"
        if ($zlib -ne $libarchiveZlib) { Copy-Item $zlib $libarchiveZlib -Force }
        # libarchive2-sys does not track VCPKG_DEFAULT_TRIPLET as a build-script input.
        cargo clean -p libarchive2-sys
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $vcpkgPrefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET"
        "CMAKE_PREFIX_PATH=$vcpkgPrefix" >> $env:GITHUB_ENV
        "ZLIB_ROOT=$vcpkgPrefix" >> $env:GITHUB_ENV
