[package]
name = "rustzip-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[features]
rar = ["rz-formats/rar"]

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
rz-core = { path = "../crates/rz-core" }
rz-formats = { path = "../crates/rz-formats" }
rz-audio-preview = { path = "../apps/audio-preview" }
rz-video-renderer = { path = "../apps/video-renderer" }
hayro = { version = "0.7.1", default-features = false }
tempfile = "3"

[[bin]]
name = "zip_recovery"
path = "fuzz_targets/zip_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chm"
path = "fuzz_targets/chm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bzip2"
path = "fuzz_targets/bzip2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rar"
path = "fuzz_targets/rar.rs"
required-features = ["rar"]
test = false
doc = false
bench = false

[[bin]]
name = "nsis"
path = "fuzz_targets/nsis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_parser"
path = "fuzz_targets/pdf_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audio_decoder"
path = "fuzz_targets/audio_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "video_decoder"
path = "fuzz_targets/video_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifact_smoke"
path = "fuzz_targets/artifact_smoke.rs"
test = false
doc = false
bench = false
