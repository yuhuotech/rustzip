[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "Transitive through the pinned GPUI/time stack; RustSec lists no safe upgrade. Recheck when GPUI updates." },
    { id = "RUSTSEC-2024-0436", reason = "Transitive through the pinned GPUI macro stack; RustSec lists no safe upgrade. Recheck when GPUI updates." },
    { id = "RUSTSEC-2026-0192", reason = "Transitive through the pinned GPUI font stack; RustSec lists no safe upgrade. Recheck when GPUI updates." },
    { id = "RUSTSEC-2026-0206", reason = "Transitive through the pinned GPUI font stack; RustSec lists no safe upgrade. Recheck when GPUI updates." },
    { id = "RUSTSEC-2026-0372", reason = "Transitive through the pinned GPUI/accesskit D-Bus stack; the advisory lists no safe upgrade until upstream moves to zbus 6. Recheck on the next GPUI upgrade." },
    { id = "RUSTSEC-2026-0370", reason = "Transitive through the pinned GPUI Linux D-Bus stack; the advisory lists no safe upgrade until upstream moves to zbus 6. Recheck on the next GPUI upgrade." },
    { id = "RUSTSEC-2026-0371", reason = "Transitive through the pinned GPUI Linux D-Bus stack; the advisory lists no safe upgrade until upstream moves to zbus 6. Recheck on the next GPUI upgrade." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
