[workspace]
resolver = "2"
members = [
    "crates/rz-core",
    "crates/rz-platform",
    "crates/rz-ffi",
    "crates/rz-formats",
    "crates/rz-engine",
    "crates/rz-app",
    "crates/rz-services",
    "apps/cli",
    "apps/release",
    "apps/gpui-probe",
    "apps/gui",
    "apps/audio-preview",
    "apps/pdf-renderer",
    "apps/preview-budget",
    "apps/video-renderer",
]
exclude = ["vendor/libchm", "vendor/pbz2"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
rz-core = { path = "crates/rz-core" }
rz-platform = { path = "crates/rz-platform" }
rz-ffi = { path = "crates/rz-ffi" }
rz-formats = { path = "crates/rz-formats" }
rz-engine = { path = "crates/rz-engine" }
rz-app = { path = "crates/rz-app" }
rz-services = { path = "crates/rz-services" }
tempfile = "3"
zeroize = "1"
dirs = "6"
lz4_flex = "0.14.0"
blake3 = "1.8.7"
ctrlc = "3.5.2"
libarchive2-sys = "0.2.0"
notify-rust = "4.18.2"
rpassword = "7.5.4"
sys-locale = "0.3.2"
unrar_sys = "0.5.8"
widestring = "1.2.1"
pbz2 = { version = "0.2.0", default-features = false }
zip = { version = "9.1.3", default-features = false }
crc32fast = "1"

[patch.crates-io]
pbz2 = { path = "vendor/pbz2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
