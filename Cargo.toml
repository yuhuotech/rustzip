[workspace]
resolver = "2"
members = [
    "crates/rz-core",
    "crates/rz-platform",
    "crates/rz-formats",
    "crates/rz-engine",
    "crates/rz-app",
    "crates/rz-services",
    "apps/cli",
    "apps/release",
    "apps/gpui-probe",
    "apps/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
rz-core = { path = "crates/rz-core" }
rz-platform = { path = "crates/rz-platform" }
rz-formats = { path = "crates/rz-formats" }
rz-engine = { path = "crates/rz-engine" }
rz-app = { path = "crates/rz-app" }
rz-services = { path = "crates/rz-services" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
