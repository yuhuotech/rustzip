[package]
name = "rz-updater"
description = "RustZIP independent signed update installer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rz-app.workspace = true
ed25519-dalek = { version = "3.0.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
serde_json = { version = "1.0.154", optional = true }
zip = { workspace = true, features = ["deflate"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[features]
test-fixture = ["dep:ed25519-dalek", "dep:sha2", "dep:serde_json", "dep:zip", "dep:tar", "dep:flate2"]

[[bin]]
name = "rz-updater"
path = "src/main.rs"

[[bin]]
name = "rz-update-fixture"
path = "src/fixture.rs"
required-features = ["test-fixture"]

[lints]
workspace = true
