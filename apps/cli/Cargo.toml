[package]
name = "rz"
description = "RustZIP command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ctrlc.workspace = true
rpassword.workspace = true
rz-core.workspace = true
zeroize.workspace = true
rz-app.workspace = true

[dev-dependencies]
tempfile = "3"
zip = { workspace = true, features = ["deflate"] }

[features]
# Read-only RAR support; see crates/rz-formats for the license note.
rar = ["rz-app/rar"]

[lints]
workspace = true
