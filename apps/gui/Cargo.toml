[package]
name = "rustzip-gui"
description = "RustZIP desktop application"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[lib]
name = "rustzip_gui"
path = "src/lib.rs"

[[bin]]
name = "rustzip"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.0"
# Only for the local time zone; formatting stays in rz-app.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rz-app.workspace = true
rz-core.workspace = true
rz-engine.workspace = true
rz-formats.workspace = true
rz-services.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.8.0", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[lints]
workspace = true
