[package]
name = "rustzip-gui"
description = "RustZIP desktop application"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[lib]
name = "rustzip_gui"
path = "src/lib.rs"

[[bin]]
name = "rustzip"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.0"
rz-app.workspace = true
rz-core.workspace = true
rz-engine.workspace = true
rz-formats.workspace = true

[dev-dependencies]
gpui-kit = { version = "0.8.0", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
