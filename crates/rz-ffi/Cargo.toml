[package]
name = "rz-ffi"
description = "Narrow safe wrappers for the RustZIP native format backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libarchive2-sys.workspace = true

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
