[package]
name = "rz-formats"
description = "RustZIP archive format backends and format sniffing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rz-core.workspace = true
rz-ffi.workspace = true
rz-platform.workspace = true
zip = { workspace = true, features = ["deflate", "bzip2", "zstd", "aes-crypto", "unreserved"] }
tar = "0.4"
flate2 = "1"
liblzma = { version = "0.4.9", features = ["parallel", "static"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }
bzip2 = "0.6.1"
lz4_flex.workspace = true
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "aes256", "bzip2", "zstd", "deflate", "util"] }
tempfile.workspace = true
encoding_rs = "0.8.42"
chardetng = "1.0.0"
libchm = { path = "../../vendor/libchm" }
zeroize.workspace = true
pbz2.workspace = true
crc32fast.workspace = true
sha1 = "0.11.0"
quick-xml = "0.41.0"
base64 = "0.22.1"
xpress-huffman = { path = "../../vendor/xpress-huffman" }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std"] }
apfs-core = { path = "../../vendor/apfs-core" }
lzvn = { package = "lzvn-core", version = "0.1.3" }
lzfse_rust = "0.2.1"
lzxd = { path = "../../vendor/lzxd" }
rustzip-nsis-bzip2 = { path = "../../vendor/nsis-bzip2" }
rustzip-lzms = { path = "../../vendor/lzms" }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "apfs_compressed"
harness = false

[lints]
workspace = true

[features]
# Read-only RAR support through the unRAR source (its license forbids re-creating
# the RAR compressor, which is why RustZIP never writes RAR). Off by default.
rar = ["rz-ffi/rar"]
