[package]
name = "rz-formats"
description = "RustZIP archive format backends and format sniffing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rz-core.workspace = true
rz-platform.workspace = true
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
liblzma = { version = "0.4.9", features = ["parallel", "static"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }
bzip2 = "0.6.1"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "aes256", "bzip2", "zstd", "deflate", "util"] }
unrar = { version = "0.5.8", optional = true }
tempfile = { version = "3", optional = true }
encoding_rs = "0.8.42"
chardetng = "1.0.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[features]
# Read-only RAR support through the unRAR source (its license forbids re-creating
# the RAR compressor, which is why RustZIP never writes RAR). Off by default.
rar = ["dep:unrar", "dep:tempfile"]
