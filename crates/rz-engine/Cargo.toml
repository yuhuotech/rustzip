[package]
name = "rz-engine"
description = "RustZIP engine: safe extraction with limits, progress and cancellation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rz-core.workspace = true
rz-formats.workspace = true
rz-platform.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
blake3.workspace = true
tempfile = "3"
tar = "0.4"
zip = { workspace = true, features = ["deflate"] }

[[bench]]
name = "throughput"
harness = false

[features]
rar = ["rz-formats/rar"]

[lints]
workspace = true
