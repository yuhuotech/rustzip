[package]
name = "rz-app"
description = "RustZIP application services shared by GUI and CLI: tasks, settings, updates, stats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rz-core.workspace = true
rz-formats.workspace = true
rz-engine.workspace = true
rz-platform.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
blake3.workspace = true
semver = "1.0.28"
getrandom = "0.4.3"
zeroize.workspace = true

[lints]
workspace = true

[features]
rar = ["rz-formats/rar", "rz-engine/rar"]

[dev-dependencies]
tempfile = "3.27.0"
zip = { workspace = true, features = ["deflate"] }

[[bench]]
name = "zip_edit"
harness = false
